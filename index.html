<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO生态挖矿矩阵</title>
    <!-- Tailwind CSS 生产环境建议链接 -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/remixicon/2.5.0/remixicon.css" rel="stylesheet">

    <!-- 字体优化：增加内联样式确保 Apple 字体优先 -->
    <style>
        body {
            /* 现代 Apple 字体栈，极致轻盈感 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.015em;
        }
        /* 强制修复首页导航为 4 列横排 */
        .nav-grid {
            display: grid !important;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 1.5rem 0.5rem !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 全局弹窗系统 -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[999] hidden items-center justify-center p-4">
        <div class="modal-box w-full max-w-sm bg-white rounded-[2.5rem] shadow-2xl overflow-hidden"> 
            <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white/50">
                <h4 id="modalTitle" class="font-bold text-slate-800 uppercase text-xs tracking-widest">提示</h4>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 transition-all">✕</button>
            </div>
            <div id="modalContent" class="p-8 text-sm text-slate-600 leading-relaxed"></div>
        </div>
    </div>

    <!-- 顶部页眉 -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 px-4 py-3">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="assets/head_logo.png" alt="Logo" class="w-10 h-10 bg-white rounded-xl shadow-sm border border-slate-100 object-contain p-1">
                <h1 class="text-xl font-bold text-slate-800 tracking-tighter" data-i18n="title">
                    NEO生态挖矿矩阵
                </h1>
            </div>
            <div class="bg-slate-100 rounded-xl px-1">
                <select id="langSelect" onchange="switchLang(this.value)" class="bg-transparent border-none text-xs px-2 py-2 font-bold text-slate-700 outline-none">
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="zh-CN">🇨🇳 简体中文</option>
                    <option value="zh-HK">🇭🇰 繁體中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="ko">🇰🇷 한국어</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 资产总览卡片 -->
    <section class="max-w-xl mx-auto px-4 mt-4">
        <div class="glass-card rounded-[2.5rem] p-8 text-center bg-white shadow-sm border-b-2 border-indigo-500/10">
            <div id="walletAddr" data-i18n="connect" onclick="handleWalletClick()" class="cursor-pointer font-bold bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full text-[10px] border border-indigo-100 mb-4 inline-block active:scale-95 transition-transform">
                连接钱包
            </div>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1" data-i18n="total_value">总资产价值</p>
            <div class="text-3xl font-bold text-slate-800 tracking-tighter">
                $ <span id="totalValue">0.00</span>
            </div>
        </div>
    </section>

    <main class="max-w-xl mx-auto p-4 pb-24">

        <!-- 首页视图 -->
        <div id="page-home" class="page-view space-y-6">
            <!-- 公告栏 -->
            <section class="glass-card rounded-[2rem] p-6 bg-white shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 uppercase italic tracking-wider flex items-center gap-2">
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                        <span data-i18n="news_title">公告与新闻</span>
                    </h3>
                    <span class="text-[10px] bg-slate-100 text-slate-400 px-2 py-0.5 rounded-full font-bold">LATEST</span>
                </div>
                <div id="news-container" class="space-y-4">
                    <div class="animate-pulse flex flex-col gap-2">
                        <div class="h-3 bg-slate-100 rounded w-3/4"></div>
                        <div class="h-3 bg-slate-100 rounded w-1/2"></div>
                    </div>
                </div>
            </section>

            <-- 宫格导航区 -->
            <div class="nav-container bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100">
                <div class="nav-grid">
                    <div class="nav-item group" onclick="switchPage('user')">
                        <div class="nav-icon"><i class="ri-bank-card-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_finance">资产</span>
                    </div>
                    <div class="nav-item group" onclick="switchPage('stats')">
                        <div class="nav-icon"><i class="ri-stock-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_market">行情</span>
                    </div>
                    <div class="nav-item group" onclick="openExchangeModal()">
                        <div class="nav-icon"><i class="ri-exchange-funds-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_exchange">闪兑</span>
                    </div>
                    <div class="nav-item group" onclick="handleNavClick('news')">
                        <div class="nav-icon"><i class="ri-broadcast-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_news">快讯</span>
                    </div>
                    <div class="nav-item group" onclick="handleNavClick('shop')">
                        <div class="nav-icon"><i class="ri-shopping-bag-3-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_shopping">商城</span>
                    </div>
                    <div class="nav-item group" onclick="handleNavClick('life')">
                        <div class="nav-icon"><i class="ri-cup-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_lifestyle">生活</span>
                    </div>
                    <div class="nav-item group" onclick="handleNavClick('card')">
                        <div class="nav-icon"><i class="ri-visa-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_vcard">虚拟卡</span>
                    </div>
                    <div class="nav-item group" onclick="handleNavClick('gift')">
                        <div class="nav-icon"><i class="ri-gift-line"></i></div>
                        <span class="nav-text font-bold" data-i18n="nav_rewards">福利</span>
                    </div>
                </div>
            </div>
            
            <!-- 外部链接按钮 -->
            <div class="grid grid-cols-2 gap-4">
                <a href="#" onclick="handleNav('whitepaper')" class="glass-card p-6 rounded-[2rem] text-center bg-white border border-slate-100 active:scale-95 transition-all shadow-sm">
                    <div class="text-3xl mb-1 text-indigo-500">📜</div>
                    <p class="text-[10px] font-bold uppercase text-slate-400" data-i18n="nav_wp">白皮书</p>
                </a>
                <a href="https://bscscan.com/" target="_blank" class="glass-card p-6 rounded-[2rem] text-center bg-white border border-slate-100 active:scale-95 transition-all shadow-sm">
                    <div class="text-3xl mb-1 text-indigo-500">🌏</div>
                    <p class="text-[10px] font-bold uppercase text-slate-400">区块浏览器</p>
                </a>
            </div>

            <!-- 合作伙伴 -->
            <section class="space-y-4">
                <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-2" data-i18n="partners_title">Partners & Wallet</h4>
                <div class="flex justify-between items-center bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm">
                    <a href="https://web3.bitget.com" target="_blank" class="opacity-40 hover:opacity-100 transition-opacity"><img src="assets/bitget.png" class="h-4"></a>
                    <a href="https://www.binance.com" target="_blank" class="opacity-40 hover:opacity-100 transition-opacity"><img src="assets/bajys.png" class="h-4"></a>
                    <a href="https://www.okx.com" target="_blank" class="opacity-40 hover:opacity-100 transition-opacity"><img src="assets/ouyi.webp" class="h-4"></a>
                    <a href="https://www.tokenpocket.pro" target="_blank" class="opacity-40 hover:opacity-100 transition-opacity"><img src="assets/tp.png" class="h-4"></a>
                </div>
            </section>
        </div>

        <!-- 矿场页面 -->
        <div id="page-mine" class="page-view hidden space-y-6">
            <section class="glass-card p-6 bg-white shadow-sm rounded-[2rem]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-slate-800 text-xl tracking-tight uppercase" data-i18n="miner_title">我的矿机</h3>
                    <span class="status-badge bg-emerald-50 text-emerald-500 px-3 py-1 rounded-full text-[10px] font-bold border border-emerald-100">Running</span>
                </div>
                <div class="flex gap-4 items-center mb-6 p-1">
                    <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center border border-slate-100 shadow-inner">
                        <img src="assets/miner_logo.webp" alt="Miner" class="w-12 h-12 object-contain" onerror="this.src='assets/head_logo.png'">
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base italic uppercase" data-i18n="miner_name">FBS Smart Miner S1</h3>
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider" data-i18n="miner_desc">高性能算力终端</p>
                    </div>
                </div>
                <div class="data-grid bg-slate-50/80 p-5 rounded-[2rem] grid grid-cols-2 gap-4 border border-slate-100">
                    <div class="data-item">
                        <span class="text-[9px] text-slate-400 font-bold uppercase mb-1" data-i18n="m_count">矿机数量</span>
                        <span id="miner_count" class="text-xl font-bold text-slate-800">0</span>
                    </div>
                    <div class="data-item">
                        <span class="text-[9px] text-slate-400 font-bold uppercase mb-1" data-i18n="m_yield">预估日产</span>
                        <span id="miner_daily" class="text-xl font-bold text-slate-800">0.00</span>
                    </div>
                    <div class="data-item pt-2 border-t border-slate-200">
                        <span class="text-[9px] text-slate-400 font-bold uppercase mb-1" data-i18n="m_term">到期时间</span>
                        <span id="miner_deadline" class="text-xs font-bold text-slate-600">--</span>
                    </div>
                    <div class="data-item pt-2 border-t border-slate-200">
                        <span class="text-[9px] text-slate-400 font-bold uppercase mb-1" data-i18n="m_locked">锁仓金额</span>
                        <span id="miner_locked" class="text-xs font-bold text-slate-600">0.00</span>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3 mt-6">
                    <button onclick="openMinerModal('buy')" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="buy_miner">购买矿机</span></button>
                    <button onclick="openTransferMinerModal()" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="transfer_miner">转让矿机</span></button>
                    <button onclick="openMinerModal('fee')" class="action-btn text-[10px] py-3 bg-slate-800 active:scale-95 transition-transform"><span data-i18n="pay_fee">缴纳电费</span></button>
                </div>
            </section>
        </div>

        <!-- 个人中心视图 -->
        <div id="page-user" class="page-view hidden space-y-6">
            <section class="glass-card rounded-[2.5rem] overflow-hidden bg-white shadow-sm border border-slate-100">
                <div class="p-6 border-b border-slate-50 font-bold text-lg text-slate-400 uppercase tracking-widest bg-slate-50/30" data-i18n="assets_list">资产预览</div>
                <div id="tokenRows" class="divide-y divide-slate-50 min-h-[40px]"></div>
            </section>

            <div class="grid grid-cols-4 gap-3 px-2">
                <button onclick="openRechargeModal()" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="recharge">充值</span></button>
                <button onclick="openWithdrawModal()" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="withdraw">提币</span></button>
                <button onclick="openExchangeModal()" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="exchange">兑换</span></button>
                <button onclick="openInternalTransferModal()" class="action-btn text-[10px] py-3 active:scale-95 transition-transform"><span data-i18n="transfer">转账</span></button>
            </div>

            <!-- 团队与数据详情（略，保持原样逻辑即可） -->
            <!-- ...保持你原本的团队业绩和历史列表部分，仅需注意字体 class 调整为 font-bold 即可... -->
        </div>
    </main>

    <!-- 底部悬浮小岛导航栏 -->
    <div class="nav-wrapper">
        <nav class="bottom-nav-pill">
            <button onclick="switchPage('home')" id="nav-home" class="nav-item active">
                <i class="fas fa-house"></i>
                <span data-i18n="nav_home">首页</span>
            </button>
            <button onclick="switchPage('mine')" id="nav-mine" class="nav-item">
                <i class="fas fa-microchip"></i>
                <span data-i18n="nav_mine">矿场</span>
            </button>
            <button onclick="switchPage('stats')" id="nav-stats" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span data-i18n="nav_market">看板</span>
            </button>
            <button onclick="switchPage('user')" id="nav-user" class="nav-item">
                <i class="fas fa-circle-user"></i>
                <span data-i18n="nav_me">我的</span>
            </button>
        </nav>
    </div>
    
    <!-- 脚本加载 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <script src="js/lang/zh-CN.js"></script>
    <script src="js/lang/zh-HK.js"></script>
    <script src="js/lang/en.js"></script>
    <script src="js/lang/ja.js"></script>
    <script src="js/lang/ko.js"></script>
    <script src="js/lang/ru.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="js/navigation.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/calculations.js"></script>
    <script type="module" src="js/api-service.js"></script>
    <script type="module" src="js/wallet-utils.js"></script>
    <script type="module" src="js/ui-render.js"></script>
    <script type="module" src="js/modal-handler.js"></script>
    <script type="module" src="js/action-executor.js"></script>
    <script type="module" src="js/app-init.js"></script>
</body>
</html>
