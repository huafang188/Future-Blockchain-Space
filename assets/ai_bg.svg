<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f2f2f7"/>
  
  <!-- 光晕效果 -->
  <ellipse cx="324" cy="384" rx="400" ry="400" fill="url(#glow1)"/>
  <ellipse cx="756" cy="1152" rx="350" ry="350" fill="url(#glow2)"/>
  
  <!-- 抽象电路线条 -->
  <path d="M100,200 Q300,100 500,150 T900,100" stroke="url(#lineGrad)" stroke-width="2" fill="none" filter="url(#blur)"/>
  <path d="M80,400 Q250,350 450,420 T850,380" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" filter="url(#blur)"/>
  <path d="M120,600 Q350,520 550,600 T950,550" stroke="url(#lineGrad)" stroke-width="1" fill="none" filter="url(#blur)"/>
  
  <!-- 圆形装饰 -->
  <circle cx="200" cy="1500" r="80" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="880" cy="400" r="60" fill="url(#glow2)" filter="url(#blur)"/>
  
  <!-- 粒子效果 -->
  <circle cx="250" cy="300" r="3" fill="#a855f7" fill-opacity="0.4"/>
  <circle cx="450" cy="500" r="2" fill="#8b5cf6" fill-opacity="0.5"/>
  <circle cx="650" cy="250" r="2.5" fill="#a855f7" fill-opacity="0.3"/>
  <circle cx="800" cy="700" r="2" fill="#7c3aed" fill-opacity="0.4"/>
  <circle cx="350" cy="900" r="3" fill="#a855f7" fill-opacity="0.35"/>
  <circle cx="550" cy="1200" r="2" fill="#8b5cf6" fill-opacity="0.45"/>
  <circle cx="750" cy="1500" r="2.5" fill="#a855f7" fill-opacity="0.3"/>
  <circle cx="200" cy="750" r="2" fill="#7c3aed" fill-opacity="0.4"/>
  <circle cx="900" cy="1000" r="3" fill="#a855f7" fill-opacity="0.35"/>
  <circle cx="400" cy="1400" r="2" fill="#8b5cf6" fill-opacity="0.5"/>
  
  <!-- 网格线 -->
  <line x1="0" y1="0" x2="1080" y2="1920" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="1080" y1="0" x2="0" y2="1920" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.05"/>
  
  <!-- 中心抽象人脸轮廓 -->
  <ellipse cx="540" cy="600" rx="150" ry="200" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.1"/>
  <path d="M450,550 Q540,650 630,550" fill="none" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.1"/>
  <circle cx="480" cy="580" r="15" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15"/>
  <circle cx="600" cy="580" r="15" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>